name: Build Android APK

on:
  workflow_dispatch: # ボタンを押して手動でビルドを開始する設定

jobs:
  build:
    runs-on: ubuntu-latest

    # 💡 完璧なビルド環境が最初から整っている「公式イメージ」をそのまま丸ごと使います
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
      # 1. コードの読み込み
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 不足しているPython用のアドオンライブラリ（PDFや画像処理）だけを追加
      - name: Install Additional Python Packages
        run: |
          pip3 install --user pillow reportlab

      # 3. buildozer.spec（設定ファイル）の初期化と自動書き換え
      - name: Configure Buildozer Specification
        run: |
          buildozer init
          sed -i 's/title = My Application/title = MRC/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = mrc_app/' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg/' buildozer.spec
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy==2.3.0,pillow,reportlab/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      # 4. Android APKの組み立て実行
      - name: Build with Buildozer
        run: buildozer -v android debug

      # 5. 完成したAPKファイルを画面からダウンロードできるようにアップロード
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
