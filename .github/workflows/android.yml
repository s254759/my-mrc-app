name: Build Android APK

on:
  workflow_dispatch: # ボタンを押して手動でビルドを開始する設定

env:
  # 💡 警告への対策：GitHubのアクションを強制的に最新のNode.js 24環境で実行させます
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install --user --upgrade buildozer cython virtualenv

      - name: Initialize Buildozer
        run: |
          ~/.local/bin/buildozer init
          # Androidアプリの設定ファイルを自動書き換え
          sed -i 's/title = My Application/title = MRC/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = mrc_app/' buildozer.spec
          # 💡 エラーへの対策：アセットにjpgも含めて、不要なkvやatlasを最初から除外してエラーを防ぎます
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg/' buildozer.spec
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy==2.3.0,pillow,reportlab/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: Build Android APK
        run: ~/.local/bin/buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
