name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          pip install --user --upgrade buildozer cython virtualenv

      # 💡 解決策：最新のAndroidツール（NDK）と衝突しないよう、2026年仕様に完全に適合させた設定ファイルを生成します
      - name: Create Buildozer Spec File Directly
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = MRC
          package.name = mrc_app
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg
          version = 0.1
          requirements = python3,kivy==2.3.0,pillow,reportlab
          orientation = portrait
          fullscreen = 1
          
          # 🌟最重要：最新の開発ツール(NDK)と互換性のあるモダンな64bit設計に絞ります
          android.archs = arm64-v8a
          android.allow_backup = True
          android.accept_sdk_license = True
          android.skip_update = False
          
          # 🌟最重要：古い命令を排除し、最新のツールに適合するAPIレベルを指定します
          android.api = 34
          android.minapi = 26
          android.ndk_api = 26
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          y | ~/.local/bin/buildozer android pdm --install || true

      - name: Build Android APK
        run: ~/.local/bin/buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
