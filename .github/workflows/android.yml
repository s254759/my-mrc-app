name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 💡 解決策1: コンパイル衝突が絶対に起きない、世界で最もAndroidビルド実績のあるPython 3.9環境に固定
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake
          # 💡 解決策2: Cythonなどの翻訳部品も、エラーを起こさない過去の安定バージョンで強制固定します
          pip install --user "cython<3.0.0" virtualenv
          pip install --user --upgrade buildozer

      # 💡 解決策3: Buildozerに対し、「余計な最新パーツの自動ダウンロードを禁止」し、一番手堅い構成で組むよう命令します
      - name: Create Buildozer Spec File Directly
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = MRC
          package.name = mrc_app
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg
          version = 0.1
          
          # Kivyのバージョンも自動取得ではなく、エラーが起きない古い安定版を指定
          requirements = python3,kivy==2.1.0
          orientation = portrait
          fullscreen = 1
          
          android.archs = arm64-v8a
          android.allow_backup = True
          android.accept_sdk_license = True
          android.skip_update = False
          
          # Android 13の安定レールに乗せます
          android.api = 33
          android.minapi = 26
          android.ndk_api = 26
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Pre-setup Android SDK Platform 33
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          y | ~/.local/bin/buildozer android pdm --install || true

      - name: Build Android APK
        run: ~/.local/bin/buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
